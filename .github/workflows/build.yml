name: Build Combined Enchants Fabric

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build
        run: |
          gradle build --no-daemon > log.txt 2>&1 || {
            grep -E -A3 "error:|What went wrong|Could not|Exception" log.txt | head -60
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CombinedEnchantsFabric
          path: build/libs/*.jar
